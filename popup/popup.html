<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>real-extension</title>
  <style>
    body { width: 340px; margin: 16px; font-size: 12px; line-height: 1.4; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    p { margin: 12px 0; }
    button { font-size: inherit; }
    fieldset { border: 0; padding: 0; margin: 0 0 12px; }
    #modules { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .module { display: flex; align-items: baseline; gap: 4px; }
    details label { display: block; }
    summary { cursor: pointer; }
    #message:empty { display: none; }
  </style>
  <script src="popup.js" type="module"></script>
</head>
<body>
  <h1>real-extension</h1>
  <fieldset id="settings" disabled>
    <div id="modules">
      <div class="module">
        <input type="checkbox" id="namemc" aria-label="Enable NameMC">
        <details>
          <summary>NameMC</summary>
          <label><input type="checkbox" data-module="namemc" data-feature="locatorDot"> Locator Dot</label>
          <label><input type="checkbox" data-module="namemc" data-feature="externalSites"> External Sites</label>
          <label><input type="checkbox" data-module="namemc" data-feature="hytaleName"> Hytale Name Checker</label>
          <label><input type="checkbox" data-module="namemc" data-feature="nameHistory"> Better Name History</label>
          <label><input type="checkbox" data-module="namemc" data-feature="betterSkinViewer"> Better Skin Viewer</label>
        </details>
      </div>
      <div class="module">
        <input type="checkbox" id="riot2fa" aria-label="Enable Riot">
        <details>
          <summary>Riot</summary>
          <label><input type="checkbox" data-module="riot2fa" data-feature="ticketTextFix"> Ticket text fix</label>
        </details>
      </div>
      <div class="module">
        <input type="checkbox" id="labymod" aria-label="Enable LabyMod">
        <details>
          <summary>Laby</summary>
          <label><input type="checkbox" data-module="labymod" data-feature="elytraCapeFix"> Elytra cape fix</label>
        </details>
      </div>
    </div>
    <button id="reset" type="button">Reset toggles</button>
  </fieldset>
  <p>Turn on a module, then expand it to choose its features.</p>
  <p id="message" role="status"></p>
</body>
</html>
